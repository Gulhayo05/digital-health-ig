name: Validate docs

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

jobs:
  sushi:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Sushi
        run: npm install -g fsh-sushi

      - name: Validate with Sushi
        run: sushi .

  ig-publisher:
    runs-on: ubuntu-latest

    env:
      JAVA_TOOL_OPTIONS: "-Xmx8g"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Jekyll
        run: sudo gem install jekyll

      - name: Install Sushi
        run: npm install -g fsh-sushi

      - name: Download IG Publisher
        run: |
          mkdir -p input-cache
          curl -L https://github.com/HL7/fhir-ig-publisher/releases/latest/download/publisher.jar \
            -o input-cache/publisher.jar

      - name: Build IG
        run: |
          java -Xmx8g -jar input-cache/publisher.jar -ig ig.ini
          echo "✅ IG built successfully"

      - name: Check QA report
        run: |
          MAX_ALLOWED_ERRORS=0
          MAX_ALLOWED_WARNINGS=0

          if [ ! -f "output/qa.json" ]; then
            echo "❌ QA file not found: output/qa.json"
            exit 1
          fi

          ERRORS=$(jq -r '.errs // 0' output/qa.json)
          WARNINGS=$(jq -r '.warnings // 0' output/qa.json)

          echo "QA Results:"
          echo "Errors: $ERRORS"
          echo "Warnings: $WARNINGS"

          print_messages() {
            if [ -f "output/qa.txt" ]; then
              echo ""
              echo "::group::QA report (errors + unsuppressed warnings only)"
              grep -vE '^ [^:]+ : 0 / 0 / [0-9]+$' output/qa.txt \
                | grep -vE '^ \* (INFORMATION|HINT|NOTE|INFO) :' \
                || true
              echo "::endgroup::"
            fi
          }

          if [ "$ERRORS" -gt "$MAX_ALLOWED_ERRORS" ]; then
            echo "❌ Too many errors: $ERRORS (maximum allowed: $MAX_ALLOWED_ERRORS)"
            print_messages
            exit 1
          fi

          if [ "$WARNINGS" -gt "$MAX_ALLOWED_WARNINGS" ]; then
            echo "❌ Warnings found: $WARNINGS (maximum allowed: $MAX_ALLOWED_WARNINGS)"
            print_messages
            exit 1
          fi

          echo "✅ QA check passed: $ERRORS errors and $WARNINGS warnings"

      - name: Upload output folder
        if: always() && hashFiles('output/**/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ig-output-${{ github.run_number }}
          path: output/
          retention-days: 30
          if-no-files-found: warn